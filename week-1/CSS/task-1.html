<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .profile-header {
            position: relative;
            width: 100%;
            height: 300px;
        }
        .cover-photo {
            width: 100%;
            height: 200px;
            background-color: #ccc;
            /* background-image: url('https://media.licdn.com/dms/image/D5616AQHq-DwwqbNVdQ/profile-displaybackgroundimage-shrink_350_1400/0/1683695187637?e=1725494400&v=beta&t=3cqTHFxTa5-IHk0ZmAUauXkp97qcIn7Fu7EOgWvgmjc'); */
            background-size: cover;
            background-position: center;
        }
        .profile-picture {
            position: absolute;
            bottom: -50px;
            left: 20px;
            width: 100px;
            height: 100px;
            border: 5px solid white;
            border-radius: 50%;
            background-color: #fff;
            background-image: url('https://avatars.githubusercontent.com/u/98202942?v=4');
            background-size: cover;
            background-position: center;
        }
        .user-info {
            margin-left: 140px;
            padding: 10px 20px;
        }
        h1 {
            margin: 0;
            font-size: 24px;
        }
         p {
            margin: 5px 0;
            color: #555;
        }
        .navigation {
            margin-top: 20px;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: center;
            background-color: #f9f9f9;
            padding: 10px 0;
        }
        a {
            margin: 0 15px;
            color: #333;
            text-decoration: none;
            font-size: 16px;
            padding: 10px 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="profile-header">
        <div class="cover-photo">
            <img src="https://media.licdn.com/dms/image/D5616AQHq-DwwqbNVdQ/profile-displaybackgroundimage-shrink_350_1400/0/1683695187637?e=1725494400&v=beta&t=3cqTHFxTa5-IHk0ZmAUauXkp97qcIn7Fu7EOgWvgmjc" alt="cover">
        </div>
        <div class="profile-picture">
        </div>
        <div class="user-info">
            <h1>Raghu Vamsi</h1>
            <p>Aspring as MERN Stack Developer</p>
            <p>India, HYB</p>
        </div>
    </div>
    <div class="navigation">
        <a href="#timeline">Timeline</a>
        <a href="#about">About</a>
        <a href="#friends">Friends</a>
        <a href="#photos">Photos</a>
        <a href="#more">More</a>
    </div>
</body>
</html>
